name: Pruebas de análisis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73c27597364c9af683 # v4.2.2
      - name: Verificar casos de datos faltantes y WASO
        run: node --test tests/analysis.test.mjs
